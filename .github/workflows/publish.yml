name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Publish target
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && 'testpypi' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && 'pypi' || 'pypi') }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(python -c 'from pathlib import Path; text=Path("src/agentcogs/_version.py").read_text(); print(text.split(chr(34))[1])')
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$pkg"
      - run: python -m build
      - run: twine check dist/*
      - name: Sdist contains the SDK only
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '/(backend|dashboard|tools|docs)/'; then
            echo "sdist includes more than the SDK"
            exit 1
          fi
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
