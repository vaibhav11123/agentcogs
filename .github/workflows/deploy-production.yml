# Manual production deploy. A push does not deploy.
# Keep secrets out of a job-level `if`. GitHub otherwise opens a failed
# run with no jobs on every push, which is what the Actions tab was showing.
name: Deploy production

on:
  workflow_dispatch:

jobs:
  deploy-api:
    name: Railway API
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway token
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN is unset. API deploy skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: railwayapp/railway-action@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: api
          root_directory: backend

  deploy-dashboard:
    name: Vercel dashboard
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel token
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is unset. Dashboard deploy skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.skip != 'true'
        working-directory: dashboard
      - run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.gate.outputs.skip != 'true'
        working-directory: dashboard
        env:
          VITE_API_URL: https://api.agentcogs.dev
