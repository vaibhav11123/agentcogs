# Manual production deploy. A push does not deploy.
# Keep secrets out of a job-level `if`. GitHub otherwise opens a failed
# run with no jobs on every push, which is what the Actions tab was showing.
name: Deploy production

on:
  workflow_dispatch:

jobs:
  deploy-api:
    name: Railway API
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway token
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN is unset. API deploy skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: railwayapp/railway-action@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: api
          root_directory: backend

  deploy-dashboard:
    name: Vercel dashboard
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel token
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is unset. Dashboard deploy skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: "20"
      - name: Stage the production build without moving the domain
        if: steps.gate.outputs.skip != 'true'
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset VITE_API_URL
          url=$(npx --yes vercel@39 deploy --prod --skip-domain --token="$VERCEL_TOKEN" --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged $url"
      - name: Check the staged sample
        if: steps.gate.outputs.skip != 'true'
        env:
          URL: ${{ steps.stage.outputs.url }}
        run: |
          curl -fsS "$URL/" | grep -q "Open Patternstack"
          curl -fsS "$URL/demo?sample=1" | grep -q "agentcogs"
          js=$(curl -fsS "$URL/" | grep -oE '/assets/index-[^"]+\.js' | head -1)
          test -n "$js"
          curl -fsS "$URL$js" | grep -q "2026-11-14"
          curl -fsS "$URL$js" | grep -q "cap "
          echo "script=$js" >> "$GITHUB_STEP_SUMMARY"
      - name: Point the domain at the staged build
        if: steps.gate.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.stage.outputs.url }}
        run: |
          npx --yes vercel@39 promote "$URL" --yes --token="$VERCEL_TOKEN"
          curl -fsS https://agentcogs.vercel.app/ | grep -q "Open Patternstack"
          echo "production=https://agentcogs.vercel.app" >> "$GITHUB_STEP_SUMMARY"
