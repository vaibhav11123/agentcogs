name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Repo guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No Cursor co-author on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x scripts/check_no_cursor_attribution.sh scripts/audit_before_public.sh
          ./scripts/check_no_cursor_attribution.sh HEAD
      - name: Private paths not tracked
        env:
          SKIP_TESTS: "1"
        run: |
          chmod +x scripts/audit_before_public.sh
          ./scripts/audit_before_public.sh

  sdk:
    name: SDK Tests (shekel ${{ matrix.shekel-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shekel-version: ["1.2.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install SDK + shekel
        run: |
          if [ "${{ matrix.shekel-version }}" = "latest" ]; then
            pip install -e ".[dev]" "shekel[openai,anthropic]>=1.2,<2"
          else
            pip install -e ".[dev]" "shekel[openai,anthropic]==${{ matrix.shekel-version }}"
          fi
      - run: pytest tests/ -q

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install .
      - run: pip install pytest pytest-asyncio
      - run: PYTHONPATH=. pytest tests/ -q

  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
