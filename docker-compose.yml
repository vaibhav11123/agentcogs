services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: agentcogs
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/agentcogs
    volumes:
      - ./backend/migrations/versions:/migrations:ro
    entrypoint: >
      bash -c 'for f in /migrations/*.sql; do
        echo "Applying $$f";
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f";
      done'
    restart: "no"

  api:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/agentcogs
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-selfhost-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ENVIRONMENT: selfhost
    ports: ["8000:8000"]

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports: ["3000:80"]

volumes:
  pgdata:
