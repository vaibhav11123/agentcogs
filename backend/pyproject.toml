[project]
name = "agentcogs-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "stripe>=11.0",
    "resend>=2.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",
    "orjson>=3.10",
]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
